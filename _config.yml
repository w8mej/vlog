---
#
# This file contains configuration flags to customize your site
#

# Name of your site (displayed in the header)
name: John Menerick | Security Engineer
# Name of the author
author: John W8MEJ Menerick

# Short bio or description (displayed in the header)
description: Explore cutting-edge cybersecurity insights and protective strategies with John Menerick. Deep dives, threat analysis, and live streams from securesql.info.

# URL of your avatar or profile pic (used by post author card)
avatar: /images/reverie.png.avif

# Timezone
timezone: America/Los_Angeles

future: true

# Your website URL
url: https://www.securesql.info
baseurl: ""

permalink: /:year/:month/:day/:title/

collections:
  tech_posts:
    output: true
    permalink: /tech_posts/:year/:month/:day/:title/

kramdown:
  input: GFM
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    css_class: 'highlight'

sass:
  style: "compressed"

plugins:
  - jekyll-sitemap
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-redirect-from

feed:
  posts_limit: 200

include: ['_pages']

exclude:
  - Gemfile
  - Gemfile.lock
  - LICENSE
  - README.md
  - CNAME
  - vendor/
  - .bundle/
  - scratchpad/
  - TODO
  - "TODO_Understand Jekyll Portfolio Website.md"
  - Prompts.txt
  - linkedin-content-v2-ciso-audience.md

defaults:
  - scope:
      path: ""
      type: "pages"
    values:
      sitemap: true
  - scope:
      path: "assets/**/*.pdf"
    values:
      sitemap: false

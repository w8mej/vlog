---
layout: default
---

<article class="ed-page">
  <header class="ed-page-head">
    {% if page.kicker %}<div class="ed-kicker">{{ page.kicker }}</div>{% endif %}
    <h1 class="ed-page-title">{{ page.title }}</h1>
    {% if page.description %}
    <p class="ed-page-standfirst">{{ page.description }}</p>
    {% endif %}
  </header>

  <div class="entry ed-page-entry">
    {{ content }}
  </div>
</article>
